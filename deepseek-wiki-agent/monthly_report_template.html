<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* ============================================================
   月度工作报告 · 标准化模板 v1.2（deepseek-wiki-agent）
   v1.1: 渲染不再依赖 IntersectionObserver（静态快照/PDF 不空白）
   v1.2: hero 改左对齐紧凑页头；图表 2×2 网格；客户条形图尾部聚合\n   v1.3: 动画降级为可选增强（双 rAF 探测），冻结动画的查看器也全量显示
   设计语言：Apple 风 —— 大字号、留白、圆角卡片、渐变点缀、
   滚动渐入动画、深色模式自适应；零外部依赖，离线可打开。
   ============================================================ */
/* 彩色主题（v1.1）：全页极光渐变背景，不使用灰黑色；不随系统深色模式变黑 */
:root {
  --bg-card: rgba(255,255,255,.82);
  --bg-card-soft: rgba(255,255,255,.62);
  --text: #1e2142;
  --text-2: #575d80;
  --text-3: #7c81a1;
  --line: rgba(94,92,230,.13);
  --blue: #0071e3; --indigo: #5e5ce6; --purple: #bf5af2;
  --pink: #ff375f; --red: #ff453a; --orange: #ff9f0a;
  --green: #30d158; --teal: #40c8e0; --mint: #63e6b6;
  --shadow: 0 4px 24px rgba(94,92,230,.10), 0 1px 3px rgba(94,92,230,.06);
  --shadow-lg: 0 12px 48px rgba(94,92,230,.16), 0 2px 8px rgba(94,92,230,.08);
  --radius: 22px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: linear-gradient(165deg, #e8f1ff 0%, #f3edff 26%, #ffeef6 52%, #e9f9f4 78%, #eaf2ff 100%);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* 全页极光光斑层：固定在视口、缓慢漂移 */
body::before {
  content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42% 50% at 12% 16%, rgba(0,113,227,.18), transparent 70%),
    radial-gradient(38% 44% at 88% 10%, rgba(191,90,242,.16), transparent 70%),
    radial-gradient(46% 52% at 84% 80%, rgba(64,200,224,.17), transparent 70%),
    radial-gradient(40% 46% at 12% 88%, rgba(255,159,10,.12), transparent 70%),
    radial-gradient(30% 34% at 52% 48%, rgba(255,55,95,.07), transparent 70%);
  animation: aurora 26s ease-in-out infinite alternate;
}
@keyframes aurora {
  0%   { transform: translate(0,0) scale(1) rotate(0deg); }
  100% { transform: translate(2.5%,-2%) scale(1.08) rotate(1.2deg); }
}
::selection { background: rgba(0,113,227,.25); }

/* ---------- 顶部导航 ---------- */
.nav {
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  background: var(--bg-card-soft);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 22px;
  display: flex; align-items: center; gap: 26px; height: 52px;
  overflow-x: auto; scrollbar-width: none;
}
.nav-inner::-webkit-scrollbar { display: none; }
.nav-logo { font-weight: 700; font-size: 15px; letter-spacing: .2px; white-space: nowrap; }
.nav-logo span { background: linear-gradient(90deg, var(--blue), var(--purple)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.nav a { color: var(--text-2); text-decoration: none; font-size: 13px; white-space: nowrap; transition: color .2s; }
.nav a:hover { color: var(--text); }

/* ---------- Hero（左对齐紧凑页头，与正文同一栅格） ---------- */
.hero {
  position: relative; text-align: left;
  padding: 64px 0 44px; overflow: hidden;
}
.hero-bg {
  position: absolute; inset: -60% -20%;
  background:
    radial-gradient(34% 46% at 12% 20%, rgba(0,113,227,.13), transparent 70%),
    radial-gradient(30% 40% at 60% 10%, rgba(191,90,242,.10), transparent 70%),
    radial-gradient(36% 46% at 90% 70%, rgba(48,209,88,.07), transparent 70%);
  animation: drift 24s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes drift {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(3%, -2%) scale(1.06); }
}
.hero-inner { position: relative; }
.hero-eyebrow {
  font-size: 12.5px; font-weight: 700; color: var(--text-3);
  letter-spacing: 2.2px; text-transform: uppercase;
}
.hero h1 {
  margin-top: 10px;
  font-size: clamp(26px, 3.6vw, 38px); font-weight: 800; line-height: 1.2;
  letter-spacing: -.6px;
  padding-left: 16px; border-left: 4px solid var(--blue);
}
.hero h1 .grad {
  background: linear-gradient(92deg, var(--blue) 10%, var(--indigo) 45%, var(--purple) 85%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.hero-sub {
  margin: 14px 0 0; max-width: 760px;
  font-size: clamp(14.5px, 1.8vw, 17px); color: var(--text-2); line-height: 1.65;
}
.hero-meta { margin-top: 10px; font-size: 12.5px; color: var(--text-3); }
/* 动画只是增强：html.anim 由脚本用双 requestAnimationFrame 探测「渲染循环
   确实在跑」后才添加。静态快照 / PDF / 冻结动画的查看器不会得到 .anim，
   页面直接以终态呈现——任何环境下内容都不可能被动画藏住。 */
html.anim .hero-eyebrow { opacity: 0; animation: rise .7s .05s cubic-bezier(.2,.6,.2,1) forwards; }
html.anim .hero h1     { opacity: 0; animation: rise .7s .15s cubic-bezier(.2,.6,.2,1) forwards; }
html.anim .hero-sub    { opacity: 0; animation: rise .7s .25s cubic-bezier(.2,.6,.2,1) forwards; }
html.anim .hero-meta   { opacity: 0; animation: rise .7s .35s cubic-bezier(.2,.6,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

/* ---------- 容器与区块 ---------- */
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }
section { padding: 56px 0 22px; }
.sec-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); }
.sec-title { font-size: clamp(28px, 4.4vw, 42px); font-weight: 800; letter-spacing: -.8px; margin-top: 8px; }
.sec-desc { margin-top: 10px; color: var(--text-2); font-size: 16px; max-width: 720px; line-height: 1.65; }

/* 入场淡入。用纯 CSS animation 而不是「JS 观察到进入视口再加 .on」——
   后者一旦 IntersectionObserver 不触发（静态快照 / PDF 导出 / 邮件预览 /
   无头截图），整页正文会永远停在 opacity:0，报告看上去是空白的。
   CSS 动画不依赖任何脚本，both 保证结束后停在终态。 */
@keyframes revealUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
html.anim .reveal { animation: revealUp .5s cubic-bezier(.2,.6,.2,1) both; }
.reveal.on { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { html.anim .reveal { animation: none; } }

/* ---------- 统计卡 ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-top: 34px; }
.stat {
  background: var(--bg-card); border-radius: var(--radius); padding: 28px 26px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.65);
  transition: transform .35s cubic-bezier(.2,.6,.2,1), box-shadow .35s;
}
.stat:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
.stat::after {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px;
  background: linear-gradient(90deg, var(--c1, var(--blue)), var(--c2, var(--purple)));
  border-radius: 4px 4px 0 0;
}
.stat .num { font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .num small { font-size: 20px; font-weight: 700; color: var(--text-2); margin-left: 2px; }
.stat .lab { margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--text-2); }
.stat .note { margin-top: 3px; font-size: 12px; color: var(--text-3); }

/* ---------- 亮点 ---------- */
.highlights { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 34px; }
.hl {
  border-radius: var(--radius); padding: 26px;
  background: linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.5)),
              linear-gradient(135deg, rgba(0,113,227,.10), rgba(191,90,242,.08));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.65);
  font-size: 16px; line-height: 1.65; font-weight: 500;
  transition: transform .35s cubic-bezier(.2,.6,.2,1);
}
.hl:hover { transform: translateY(-4px); }
.hl .idx {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 9px; margin-bottom: 12px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #fff; font-size: 14px; font-weight: 700;
}

/* ---------- 图表区 ----------
   固定 2 列而不是 auto-fit 3 列：4 张普通卡正好 2×2，不会出现
   「第一行 3 张 + 第二行 1 张孤卡」的错位；节奏图 .wide 跨满一行。 */
.charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 34px; align-items: stretch; }
@media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }
.chart-card {
  background: var(--bg-card); border-radius: var(--radius); padding: 26px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.65);
}
.chart-card.wide { grid-column: 1 / -1; }
.chart-card h3 { font-size: 17px; font-weight: 700; }
.chart-card .sub { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
.chart-body { margin-top: 18px; }

/* 环形图 */
.donut-flex { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut-flex svg { flex: 0 0 auto; }
.donut-center-num { font-size: 26px; font-weight: 800; fill: var(--text); }
.donut-center-lab { font-size: 10.5px; fill: var(--text-3); }
.legend { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 9px; }
.legend .li { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
.legend .dot { width: 11px; height: 11px; border-radius: 4px; flex: 0 0 auto; }
.legend .name { color: var(--text-2); flex: 1; }
.legend .val { font-weight: 700; font-variant-numeric: tabular-nums; }
/* 图表入场动画一律用 @keyframes（从零值长到 JS 写死的终态，both 停在终态），
   不用「初始零值 + JS 回调改值」——后者在观察器不触发时会让图表永远空着。 */
@keyframes drawSeg { from { stroke-dashoffset: var(--seg-len, 400); } }
html.anim .donut-seg { animation: drawSeg 1.1s cubic-bezier(.3,.7,.3,1) both; }

/* 横向条形 */
.hbar-row { display: grid; grid-template-columns: 108px 1fr 64px; align-items: center; gap: 12px; margin-bottom: 12px; }
.hbar-name { font-size: 13.5px; color: var(--text-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; }
@keyframes growW { from { width: 0; } }
.hbar-fill { height: 100%; border-radius: 7px; }
html.anim .hbar-fill { animation: growW 1s cubic-bezier(.3,.7,.3,1) both; }
.hbar-val { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }

/* 日历节奏 */
.cal { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding-top: 10px; }
.cal .day { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; min-width: 0; }
@keyframes growH { from { height: 0; } }
.cal .bar { width: 100%; max-width: 20px; border-radius: 4px 4px 2px 2px; }
html.anim .cal .bar { animation: growH .9s cubic-bezier(.3,.7,.3,1) both; }
.cal .bar.dev { background: linear-gradient(180deg, var(--blue), var(--indigo)); }
.cal .bar.svc { background: linear-gradient(180deg, var(--orange), var(--pink)); border-radius: 2px; }
.cal .dnum { font-size: 9.5px; color: var(--text-3); margin-top: 5px; }
.cal .cnum { font-size: 10.5px; font-weight: 700; color: var(--text-2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.cal-legend { display: flex; gap: 18px; margin-top: 14px; font-size: 12.5px; color: var(--text-2); }
.cal-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }

/* ---------- 主题卡片 ---------- */
.themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 16px; margin-top: 34px; }
@media (max-width: 520px) { .themes { grid-template-columns: 1fr; } }
.theme {
  background: var(--bg-card); border-radius: var(--radius); padding: 28px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.65);
  transition: transform .35s cubic-bezier(.2,.6,.2,1), box-shadow .35s;
}
.theme:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
.theme-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip {
  font-size: 11.5px; font-weight: 700; padding: 4px 11px; border-radius: 999px;
  color: #fff; background: var(--chip, var(--blue)); letter-spacing: .3px; white-space: nowrap;
}
.chip.ghost { background: transparent; color: var(--text-3); border: 1px solid var(--line); font-weight: 600; }
.theme h3 { font-size: 19px; font-weight: 750; letter-spacing: -.2px; line-height: 1.35; }
.theme p { font-size: 14.5px; color: var(--text-2); line-height: 1.7; }

/* ---------- 问题清单 ---------- */
.problems { margin-top: 34px; display: flex; flex-direction: column; gap: 12px; }
.prob {
  background: var(--bg-card); border-radius: 16px; padding: 18px 22px;
  box-shadow: var(--shadow); display: flex; gap: 14px; align-items: flex-start;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.65);
  font-size: 14.5px; line-height: 1.65; color: var(--text-2);
}
.prob .ok {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; margin-top: 1px;
  background: linear-gradient(135deg, var(--green), var(--teal));
  display: flex; align-items: center; justify-content: center;
}
.prob .ok::after { content: ''; width: 6px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }

/* ---------- 明细表 ---------- */
.tbl-card { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 34px; overflow: hidden; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.65); }
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 760px; }
thead th {
  text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .6px;
  color: var(--text-3); text-transform: uppercase;
  padding: 16px 14px 12px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: rgba(255,255,255,.94);
}
tbody td { padding: 13px 14px; border-bottom: 1px solid var(--line); color: var(--text-2); vertical-align: top; line-height: 1.55; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .2s; }
tbody tr:hover { background: rgba(0,113,227,.045); }
td.subject { color: var(--text); font-weight: 500; min-width: 320px; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.tbl-note { padding: 12px 22px 16px; font-size: 12px; color: var(--text-3); }

/* ---------- 页脚 ---------- */
footer { margin-top: 70px; padding: 34px 22px 44px; border-top: 1px solid var(--line); }
footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--text-3); }

@media (max-width: 600px) {
  .hero { padding: 44px 0 32px; }
  section { padding: 42px 0 16px; }
  .hbar-row { grid-template-columns: 84px 1fr 52px; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo"><span>月度报告</span> · <span id="nav-month"></span></div>
    <a href="#overview">总览</a>
    <a href="#charts">数据图表</a>
    <a href="#themes">项目主题</a>
    <a href="#problems">问题攻坚</a>
    <a href="#dev-detail">开发任务明细</a>
    <a href="#svc-detail">客服记录明细</a>
  </div>
</nav>

<header class="hero">
  <div class="hero-bg"></div>
  <div class="wrap hero-inner">
  <div class="hero-eyebrow" id="hero-eyebrow"></div>
  <h1><span class="grad" id="hero-title"></span></h1>
  <p class="hero-sub" id="hero-sub"></p>
  <p class="hero-meta" id="hero-meta"></p>
  </div>
</header>

<main class="wrap">

  <section id="overview">
    <div class="reveal">
      <div class="sec-eyebrow">Overview</div>
      <div class="sec-title">本月总览</div>
      <p class="sec-desc" id="overview-desc"></p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="highlights" id="highlights"></div>
  </section>

  <section id="charts">
    <div class="reveal">
      <div class="sec-eyebrow">Data</div>
      <div class="sec-title">数据图表</div>
      <p class="sec-desc">来自公司开发平台的真实完成数据：开发任务与客户服务记录按类型、状态、客户与时间维度统计。</p>
    </div>
    <div class="charts" id="chart-grid"></div>
  </section>

  <section id="themes">
    <div class="reveal">
      <div class="sec-eyebrow">Projects</div>
      <div class="sec-title">项目主题详述</div>
      <p class="sec-desc">当月投入的主要项目与专项：做了什么、涉及哪些模块、解决了哪些问题。</p>
    </div>
    <div class="themes" id="theme-grid"></div>
  </section>

  <section id="problems">
    <div class="reveal">
      <div class="sec-eyebrow">Solved</div>
      <div class="sec-title">问题攻坚记录</div>
      <p class="sec-desc">当月解决的典型问题：问题现象与最终解法。</p>
    </div>
    <div class="problems" id="prob-list"></div>
  </section>

  <section id="dev-detail">
    <div class="reveal">
      <div class="sec-eyebrow">Dev Tasks</div>
      <div class="sec-title">开发任务明细</div>
      <p class="sec-desc" id="dev-detail-desc"></p>
    </div>
    <div class="tbl-card reveal">
      <div class="tbl-scroll">
        <table>
          <thead><tr><th>完成日</th><th>类型</th><th>任务主题</th><th>客户</th><th>模块</th><th>状态</th><th>工时</th></tr></thead>
          <tbody id="dev-tbody"></tbody>
        </table>
      </div>
      <div class="tbl-note" id="dev-note"></div>
    </div>
  </section>

  <section id="svc-detail">
    <div class="reveal">
      <div class="sec-eyebrow">Customer Service</div>
      <div class="sec-title">客服记录明细</div>
      <p class="sec-desc" id="svc-detail-desc"></p>
    </div>
    <div class="tbl-card reveal">
      <div class="tbl-scroll">
        <table>
          <thead><tr><th>完成日</th><th>服务类型</th><th>服务主题</th><th>客户</th><th>工时</th></tr></thead>
          <tbody id="svc-tbody"></tbody>
        </table>
      </div>
      <div class="tbl-note" id="svc-note"></div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <div id="foot-left"></div>
    <div id="foot-right"></div>
  </div>
</footer>

<script>
/* ==================== 数据注入槽（生成器替换） ==================== */
window.__REPORT_DATA__ = /*__DATA_START__*/ {} /*__DATA_END__*/;

/* ==================== 标准图表库 v1.0 ==================== */
const PALETTE = ['#0071e3','#bf5af2','#ff9f0a','#30d158','#ff375f','#5e5ce6','#40c8e0','#ffd60a','#ff453a','#63e6b6'];

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* 环形图：items=[{name,value}] */
function donutChart(container, items, centerLabel) {
  const total = items.reduce((s, x) => s + x.value, 0) || 1;
  const R = 62, C = 2 * Math.PI * R, W = 170;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', W);
  svg.setAttribute('viewBox', `0 0 ${W} ${W}`);
  let acc = 0;
  const segs = [];
  items.forEach((it, i) => {
    const frac = it.value / total;
    const seg = document.createElementNS(svgNS, 'circle');
    seg.setAttribute('cx', W/2); seg.setAttribute('cy', W/2); seg.setAttribute('r', R);
    seg.setAttribute('fill', 'none');
    seg.setAttribute('stroke', it.color || PALETTE[i % PALETTE.length]);
    seg.setAttribute('stroke-width', 20);
    seg.setAttribute('stroke-linecap', 'butt');
    seg.setAttribute('class', 'donut-seg');
    seg.setAttribute('transform', `rotate(${acc / total * 360 - 90} ${W/2} ${W/2})`);
    seg.setAttribute('stroke-dasharray', `${Math.max(frac * C - 2.5, 0.001)} ${C}`);
    /* 终态直接写在属性上；drawSeg 动画从 --seg-len 这个起点画到终态 */
    seg.setAttribute('stroke-dashoffset', 0);
    seg.style.setProperty('--seg-len', (C * 0.25).toFixed(2));
    svg.appendChild(seg); segs.push(seg);
    acc += it.value;
  });
  const t1 = document.createElementNS(svgNS, 'text');
  t1.setAttribute('x', W/2); t1.setAttribute('y', W/2 + 2);
  t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('class', 'donut-center-num');
  t1.textContent = total;
  const t2 = document.createElementNS(svgNS, 'text');
  t2.setAttribute('x', W/2); t2.setAttribute('y', W/2 + 20);
  t2.setAttribute('text-anchor', 'middle'); t2.setAttribute('class', 'donut-center-lab');
  t2.textContent = centerLabel || '';
  svg.appendChild(t1); svg.appendChild(t2);

  const flex = el('div', 'donut-flex');
  flex.appendChild(svg);
  const legend = el('div', 'legend');
  items.forEach((it, i) => {
    const li = el('div', 'li');
    li.appendChild(el('span', 'dot')).style.background = it.color || PALETTE[i % PALETTE.length];
    li.appendChild(el('span', 'name', esc(it.name)));
    li.appendChild(el('span', 'val', `${it.value} <span style="color:var(--text-3);font-weight:500">· ${Math.round(it.value/total*100)}%</span>`));
    legend.appendChild(li);
  });
  flex.appendChild(legend);
  container.appendChild(flex);
  /* 立即落到终态，绘制动画交给 CSS @keyframes drawSeg。
     不要放进 onVisible——观察器不触发的环境里图表会是空的。 */
  segs.forEach(s => s.setAttribute('stroke-dashoffset', 0));
}

/* 横向条形图：items=[{name, value, extra?}]
   opts.maxRows：超过时把尾部聚合成「其他 N 家」一行——客户名单可能有十几个，
   全列出来卡片会比同行的图表高出一倍，破坏 2×2 网格的对齐。 */
function hbarChart(container, items, opts = {}) {
  const maxRows = opts.maxRows || 0;
  if (maxRows && items.length > maxRows) {
    const rest = items.slice(maxRows - 1);
    items = items.slice(0, maxRows - 1);
    items.push({
      name: `其他 ${rest.length} 家`,
      value: rest.reduce((s, x) => s + x.value, 0),
      color: '#b9c0ca', color2: '#b9c0ca',
    });
  }
  const max = Math.max(...items.map(x => x.value), 1);
  const fills = [];
  items.forEach((it, i) => {
    const row = el('div', 'hbar-row');
    row.appendChild(el('div', 'hbar-name', esc(it.name)));
    const track = el('div', 'hbar-track');
    const fill = el('div', 'hbar-fill');
    fill.style.background = `linear-gradient(90deg, ${it.color || PALETTE[i % PALETTE.length]}, ${it.color2 || it.color || PALETTE[(i+1) % PALETTE.length]})`;
    fill.dataset.w = (it.value / max * 100) + '%';
    track.appendChild(fill); row.appendChild(track);
    row.appendChild(el('div', 'hbar-val', esc(opts.fmt ? opts.fmt(it) : it.value)));
    container.appendChild(row); fills.push(fill);
  });
  fills.forEach(f => f.style.width = f.dataset.w);
}

/* 月历节奏图：days=[{day, dev, svc}] */
function calendarChart(container, days) {
  const maxV = Math.max(...days.map(d => d.dev + d.svc), 1);
  const cal = el('div', 'cal');
  const bars = [];
  days.forEach(d => {
    const col = el('div', 'day');
    const total = d.dev + d.svc;
    col.title = `${d.day} 日：开发 ${d.dev} · 客服 ${d.svc}`;
    col.appendChild(el('div', 'cnum', total > 0 ? String(total) : ' '));
    const svcBar = el('div', 'bar svc'); svcBar.dataset.h = (d.svc / maxV * 106) + 'px';
    const devBar = el('div', 'bar dev'); devBar.dataset.h = (d.dev / maxV * 106) + 'px';
    col.appendChild(svcBar); col.appendChild(devBar);
    col.appendChild(el('div', 'dnum', String(d.day)));
    cal.appendChild(col); bars.push(svcBar, devBar);
  });
  container.appendChild(cal);
  const lg = el('div', 'cal-legend');
  lg.innerHTML = `<span><span class="dot" style="background:linear-gradient(180deg,var(--blue),var(--indigo))"></span>开发任务完成</span>
                  <span><span class="dot" style="background:linear-gradient(180deg,var(--orange),var(--pink))"></span>客服记录完成</span>`;
  container.appendChild(lg);
  bars.forEach(b => b.style.height = b.dataset.h);
}

/* 数字滚动（rAF 在后台标签页会被冻结，setTimeout 兜底保证最终值一定落位） */
function countUp(elm, target, suffix) {
  const dur = 1300, t0 = performance.now();
  const isFloat = target % 1 !== 0;
  const final = () => { elm.firstChild.nodeValue = isFloat ? target.toFixed(1) : String(target); };
  function tick(t) {
    const p = Math.min((t - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    elm.firstChild.nodeValue = isFloat ? (target * eased).toFixed(1) : Math.round(target * eased);
    if (p < 1) requestAnimationFrame(tick);
  }
  elm.textContent = '0';
  if (suffix) elm.appendChild(el('small', '', suffix));
  requestAnimationFrame(tick);
  setTimeout(final, dur + 150);
}

/* 可见性触发（进场动画统一入口） */
const _pending = new Map();
const _io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      en.target.classList.add('on');
      const cb = _pending.get(en.target);
      if (cb) { cb(); _pending.delete(en.target); }
      _io.unobserve(en.target);
    }
  });
}, { threshold: 0.18 });
function onVisible(elm, cb) {
  _pending.set(elm, cb);
  _io.observe(elm);
  /* 兜底：有些渲染环境（静态快照、PDF 导出、邮件预览、无头截图）不跑
     IntersectionObserver，回调永远不触发，整页会停在「统计卡全是 0 + 内容不显示」
     的初始态。1.6s 后强制落位，正常浏览器里此时动画早已跑完，不受影响。 */
  setTimeout(() => {
    if (!_pending.has(elm)) return;
    _pending.delete(elm);
    _io.unobserve(elm);
    elm.classList.add('on');
    try { cb(); } catch (e) { /* 单个卡片失败不阻断整页 */ }
  }, 1600);
}

/* ==================== 页面渲染 ==================== */
const TYPE_COLORS = {
  '新开发需求': '#0071e3', '功能完善': '#5e5ce6', '测试问题修改': '#ff9f0a',
  '技术代码优化': '#30d158', '修正错误(普通)': '#ff453a', '修正错误(紧急)': '#ff375f',
  '提供补丁文件': '#0071e3', '提供模块更新': '#bf5af2', '在线技术支持': '#30d158',
  '系统异常处理': '#ff453a', '文档编写': '#40c8e0',
};
const STATUS_COLORS = { '内测通过': '#30d158', '完成待测': '#ff9f0a', '完成待重测': '#ff453a', '测试通过': '#0071e3', '处理完成': '#30d158' };

function render() {
  const D = window.__REPORT_DATA__;
  if (!D || !D.month) { document.body.innerHTML = '<p style="padding:60px;text-align:center">报告数据未注入</p>'; return; }

  document.title = D.monthLabel + ' 工作月报 · ' + D.person;
  document.getElementById('nav-month').textContent = D.monthLabel;
  document.getElementById('hero-eyebrow').textContent = 'Monthly Report · ' + D.person;
  document.getElementById('hero-title').textContent = D.monthLabel + ' 工作月报';
  document.getElementById('hero-sub').textContent = D.narrative.overview_short || '';
  document.getElementById('hero-meta').textContent = `数据来源：FLUX 开发平台 + ${D.meta.sessionCount || '—'} 个 AI 会话记录 + ${D.meta.dailyReportCount || 0} 份日报 · 生成于 ${D.meta.generatedAt}`;
  document.getElementById('overview-desc').textContent = D.narrative.overview || '';

  /* 统计卡 */
  const statsBox = document.getElementById('stats');
  (D.stats || []).forEach((s, i) => {
    const card = el('div', 'stat');
    card.style.setProperty('--c1', PALETTE[i*2 % PALETTE.length]);
    card.style.setProperty('--c2', PALETTE[(i*2+1) % PALETTE.length]);
    /* 初始就写最终值：countUp 只是锦上添花，动画没跑起来时也不能显示成 0 */
    const num = el('div', 'num', (s.value % 1 !== 0) ? s.value.toFixed(1) : String(s.value));
    if (s.suffix) num.appendChild(el('small', '', s.suffix));
    card.appendChild(num);
    card.appendChild(el('div', 'lab', esc(s.label)));
    if (s.note) card.appendChild(el('div', 'note', esc(s.note)));
    statsBox.appendChild(card);
    onVisible(card, () => countUp(num, s.value, s.suffix));
  });

  /* 亮点 */
  const hlBox = document.getElementById('highlights');
  (D.narrative.highlights || []).forEach((h, i) => {
    const c = el('div', 'hl reveal');
    c.appendChild(el('div', 'idx', String(i + 1)));
    c.appendChild(el('div', '', esc(h)));
    hlBox.appendChild(c);
  });

  /* 图表 */
  const grid = document.getElementById('chart-grid');
  function chartCard(title, sub, wide) {
    const c = el('div', 'chart-card reveal' + (wide ? ' wide' : ''));
    c.appendChild(el('h3', '', esc(title)));
    if (sub) c.appendChild(el('div', 'sub', esc(sub)));
    const body = el('div', 'chart-body');
    c.appendChild(body); grid.appendChild(c);
    return body;
  }
  const withColor = obj => Object.entries(obj).sort((a,b) => b[1]-a[1]).map(([name, value], i) => ({name, value, color: TYPE_COLORS[name] || PALETTE[i % PALETTE.length]}));
  donutChart(chartCard('开发任务 · 按类型', '开发任务平台当月实际完成'), withColor(D.agg.devTypeCounts), '项任务');
  donutChart(chartCard('开发任务 · 按执行状态', '完成后所处的流程状态'), Object.entries(D.agg.devStatusCounts).sort((a,b) => b[1]-a[1]).map(([name, value], i) => ({name, value, color: STATUS_COLORS[name] || PALETTE[i]})), '项任务');
  donutChart(chartCard('客户服务 · 按服务类型', '客户服务记录当月实际完成'), withColor(D.agg.svcTypeCounts), '条记录');
  hbarChart(chartCard('客户维度 · 开发+客服合计', '为哪些客户投入最多'), D.agg.customerCounts.map((c, i) => ({name: c.name, value: c.dev + c.svc, color: PALETTE[i % PALETTE.length], _c: c})), { fmt: it => `${it.value} 项`, maxRows: 8 });
  calendarChart(chartCard('月内完成节奏', '按实际完成日期统计每天完成的开发任务与客服记录数', true), D.agg.dailyActivity);

  /* 主题 */
  const themeGrid = document.getElementById('theme-grid');
  const CAT_COLORS = {'Vue迁移':'#5e5ce6','任务修复':'#ff9f0a','客户项目':'#0071e3','基础设施':'#30d158','知识库':'#bf5af2','环境运维':'#40c8e0','AI工具链':'#ff375f'};
  (D.narrative.themes || []).forEach(t => {
    const card = el('div', 'theme reveal');
    const top = el('div', 'theme-top');
    const chip = el('span', 'chip', esc(t.category || '专项'));
    chip.style.setProperty('--chip', CAT_COLORS[t.category] || 'var(--blue)');
    top.appendChild(chip);
    if (t.dates) top.appendChild(el('span', 'chip ghost', esc(t.dates)));
    card.appendChild(top);
    card.appendChild(el('h3', '', esc(t.name)));
    card.appendChild(el('p', '', esc(t.detail)));
    themeGrid.appendChild(card);
  });

  /* 问题清单 */
  const probList = document.getElementById('prob-list');
  (D.narrative.problems_solved || []).forEach(p => {
    const row = el('div', 'prob reveal');
    row.appendChild(el('div', 'ok'));
    row.appendChild(el('div', '', esc(p)));
    probList.appendChild(row);
  });

  /* 开发任务明细 */
  document.getElementById('dev-detail-desc').textContent =
    `开发任务平台查询条件：主要责任人员=${D.person}，实际完成时间 ${D.month}-01 ~ ${D.month}-30，共 ${D.devTasks.length} 项，合计开发工时 ${D.agg.devHours} h。`;
  const devBody = document.getElementById('dev-tbody');
  D.devTasks.forEach(t => {
    const tr = document.createElement('tr');
    const tagC = TYPE_COLORS[t.type] || '#888';
    const stC = STATUS_COLORS[t.status] || '#888';
    tr.innerHTML = `<td class="num">${esc((t.compDate||'').slice(5))}</td>
      <td><span class="tag" style="background:${tagC}1f;color:${tagC}">${esc(t.type)}</span></td>
      <td class="subject">${esc(t.subject)}</td>
      <td>${esc(t.customer)}</td>
      <td>${esc(t.module || '')}</td>
      <td><span class="tag" style="background:${stC}1f;color:${stC}">${esc(t.status)}</span></td>
      <td class="num">${esc(t.hours)} h</td>`;
    devBody.appendChild(tr);
  });
  document.getElementById('dev-note').textContent = '数据来源：FLUX 业务运营管理系统 · 开发任务管理（' + D.meta.fetchedAt + ' 抓取）'
    + (D.meta.devExcluded ? ` · 已按口径排除「完成待重测」${D.meta.devExcluded} 项（测试打回不计完成）` : '');

  /* 客服明细 */
  document.getElementById('svc-detail-desc').textContent =
    `客户服务记录查询条件：受理人员=${D.person}，实际完成时间同上，共 ${D.svcRecords.length} 条，合计客服工时 ${D.agg.svcHours} h，覆盖 ${D.agg.customerCounts.filter(c => c.svc > 0).length} 家客户。`;
  const svcBody = document.getElementById('svc-tbody');
  D.svcRecords.forEach(t => {
    const tr = document.createElement('tr');
    const tagC = TYPE_COLORS[t.type] || '#888';
    tr.innerHTML = `<td class="num">${esc((t.compDate||'').slice(5))}</td>
      <td><span class="tag" style="background:${tagC}1f;color:${tagC}">${esc(t.type)}</span></td>
      <td class="subject">${esc(t.subject)}</td>
      <td>${esc(t.customer)}</td>
      <td class="num">${esc(t.hours)} h</td>`;
    svcBody.appendChild(tr);
  });
  document.getElementById('svc-note').textContent = '数据来源：FLUX 业务运营管理系统 · 客户服务记录（' + D.meta.fetchedAt + ' 抓取）';

  /* 页脚 */
  document.getElementById('foot-left').textContent = `${D.monthLabel} 工作月报 · ${D.person} · 模板 v1.3（标准化图表：环形图 / 条形图 / 节奏图 / 计数动画）`;
  document.getElementById('foot-right').textContent = `由 deepseek-wiki-agent 生成 · ${D.meta.generatedAt} · 触发方式 ${D.meta.trigger}`;

  /* .reveal 的入场效果已改为纯 CSS animation（见样式表），不再依赖
     IntersectionObserver——脚本不跑或观察器不触发时内容也照常显示。
     _io 现在只服务于统计卡的数字滚动，且 onVisible 自带超时兜底。 */
}
render();
/* 双 rAF 只有在渲染循环真实推进时才会回调——静态快照 / 冻结动画的环境
   拿不到 .anim，整页保持终态直出。 */
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.documentElement.classList.add('anim');
}));
</script>
